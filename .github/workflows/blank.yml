name: Keep Render App Awake

on:
  schedule:
    # Runs every 5 minutes (GitHub minimum recommended interval)
    - cron: "*/5 * * * *"
  workflow_dispatch: # allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render App
        run: |
          echo "Pinging server..."
          curl -s -o /dev/null -w "%{http_code}" https://talker-app-combined.onrender.com/
