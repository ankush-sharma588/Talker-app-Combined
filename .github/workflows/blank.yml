name: My First GitHub Action

# 1. Choose the event that triggers this automation
on: [push]

# 2. Define the jobs to run
jobs:
  say-hello:
    # Choose the server operating system
    runs-on: ubuntu-latest

    # List the chronological steps to execute
    steps:
      # Step 1: Pull your repository code onto the runner machine
      - name: Check out repository code
        uses: actions/checkout@v4

      # Step 2: Run a terminal command
      - name: Run a welcome script
        run: echo "Hello world! The action executed successfully."
